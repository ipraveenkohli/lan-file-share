user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
        listen 80;
        server_name yourserver.com;   # or IP address

        # Default website (optional)
        root /usr/share/nginx/html;
        index index.html;

        # -------------------------------
        # FILE SHARE LOCATION
        # -------------------------------
        location /files/ {
            alias /srv/files/;        # Must end with /
            autoindex on;             # Enable directory listing
            autoindex_exact_size off; # Show human-readable sizes
            autoindex_localtime on;   # Show local time
            charset utf-8;

            # Allow large file downloads
            sendfile on;
            tcp_nopush on;

            # Optional: prevent uploads (read-only)
            dav_methods off;

            # Optional: add basic security
            add_header X-Content-Type-Options nosniff;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
    }
}
